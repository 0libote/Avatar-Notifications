# Beta channel: every push to main builds the Windows installers (NSIS + MSI),
# publishes them to the floating `beta` prerelease, and updates RELEASES.md
# with the new version + download links.
#
# Versioning: 0.1.<github run_number>, stamped at build time by
# scripts/stamp-version.mjs. The repo itself stays at 0.1.0 so numbers are
# never burned by hand. (Plain numeric semver is required by the WiX/MSI
# bundler, hence no `-beta` suffix — the prerelease flag carries that meaning.)
name: Beta release (Windows)

on:
  push:
    branches: [main]
    paths-ignore:
      - RELEASES.md
      - "**.md"
      - LICENSE
      - CONTRIBUTING.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      BETA_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Stamp beta version
        run: node scripts/stamp-version.mjs "$BETA_VERSION"

      - run: npm ci
      - run: npm run build

      - name: Build Windows installers
        run: npx tauri build --bundles nsis msi

      - name: Keep installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notifbuddy-windows-beta-${{ env.BETA_VERSION }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Remove previous beta release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: gh release delete beta --yes --cleanup-tag

      - name: Publish beta prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: NotifBuddy Beta ${{ env.BETA_VERSION }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Update RELEASES.md
        run: |
          node scripts/update-release-file.mjs \
            --repo "${{ github.repository }}" \
            --tag beta \
            --version "$BETA_VERSION" \
            --sha "${{ github.sha }}" \
            --run "${{ github.run_id }}" \
            --date "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Commit release file back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add RELEASES.md
          if git diff --cached --quiet; then
            echo "RELEASES.md unchanged, nothing to commit"
          else
            git commit -m "docs: update beta release file to $BETA_VERSION [skip ci]"
            # Discard build-time modifications (stamped versions); the repo
            # intentionally stays at 0.1.0 and rebase needs a clean tree.
            git checkout -- .
            git pull --rebase origin main
            git push origin HEAD:main
          fi
